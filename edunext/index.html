<!doctype html>
<!--
  lang="ar" dir="rtl" is set HERE, on the document, not only in CSS.

  The browser applies it before any stylesheet has loaded, so the very first
  paint is already right-to-left. Setting direction only in index.css means the
  first frame renders left-to-right and visibly snaps once the CSS arrives —
  a flash every visitor sees on every cold load.

  `lang="ar"` is not decoration either: it selects Arabic shaping and line-
  breaking rules, and it is what a screen reader uses to choose its voice.
-->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBF9F5" />
    <meta
      name="description"
      content="إدنكست — منصة تعليمية ذكية تساعدك على تتبّع دوراتك، تطوير مهاراتك، وتحقيق أهدافك بخطوات واضحة ومنتظمة."
    />

    <!--
      Preconnect before the stylesheet request goes out. The font files live on
      a second origin (gstatic), so without this the browser discovers that
      origin only after parsing the CSS — one extra round trip on the critical
      path, on every first visit.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>إدنكست | تعلّم … اصنع مستقبلك</title>

    <!--
      THEME, APPLIED BEFORE THE FIRST PAINT.

      React sets the `dark` class in an effect, which runs after the first frame
      has already been painted — so a visitor who chose the dark theme would see
      the page flash light and then snap dark on every single load. The fix has
      to be a BLOCKING script in <head>: it is the only code that runs before
      the browser paints anything.

      It is deliberately tiny and dependency-free for the same reason. Anything
      that has to be fetched or parsed first would reintroduce the flash it
      exists to prevent.

      The storage key and the fallback MUST match `ThemeToggle` in
      `components/layout/Header.jsx` exactly. If they drift, this script and the
      React state disagree and the icon ends up showing the opposite of the
      theme on screen.

      try/catch because reading storage THROWS rather than returning null in
      private browsing and locked-down enterprise profiles; a theme preference
      is never worth a blank page.
    -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('edunext:theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#14121F');
          }
        } catch (error) {
          /* No stored preference available: the light theme is the default. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
